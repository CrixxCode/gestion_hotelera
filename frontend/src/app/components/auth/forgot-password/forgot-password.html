<div class="relative flex justify-center items-center min-h-screen overflow-y-auto">
  <!-- Fondo dinámico idéntico al login -->
  <swiper-container class="absolute inset-0 z-0" effect="fade" autoplay-delay="4000"
    autoplay-disable-on-interaction="false" loop="true" speed="1500">
    <swiper-slide *ngFor="let bg of backgrounds">
      <img [src]="bg" class="w-full h-full object-cover brightness-75" />
    </swiper-slide>
  </swiper-container>

  <div class="relative z-10 flex flex-col justify-center items-center 
           w-11/12 max-w-md md:w-2/5 
           px-6 sm:px-10 py-12 
           bg-white/50 md:bg-white/90 shadow-lg rounded-2xl transition-all duration-300 my-8">
    <div class="w-full">
      <div class="flex flex-col items-center mb-8">
        <img src="logo.png" alt="Hotel Logo" class="h-14 mb-2" />
        <h1 class="text-2xl font-bold text-gray-800">HotelManager Pro</h1>
      </div>

      <h2 class="text-2xl font-semibold text-center text-gray-800 mb-2">
        Recuperar Contraseña
      </h2>
      <p class="text-center text-gray-600 mb-8 text-sm">
        Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
      </p>

      <!-- Mensajes de error o éxito -->
      <div *ngIf="message" class="mb-6">
        <div class="p-3 rounded-lg text-center font-medium" [ngClass]="{
            'bg-green-100 text-green-700 border border-green-300': messageType === 'success',
            'bg-red-100 text-red-700 border border-red-300': messageType === 'error',
            'bg-yellow-100 text-yellow-700 border border-yellow-300': messageType === 'warn'
          }">
          {{ message }}
        </div>
      </div>

      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-6" *ngIf="!emailSent">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-800 mb-1">Correo Electrónico</label>
          <input pInputText id="email" formControlName="email" placeholder="ejemplo@correo.com" type="email"
            class="w-full p-2 border rounded-md backdrop-blur-sm" />
        </div>

        <button pButton type="submit" label="Enviar enlace" [loading]="isLoading"
          class="w-full !bg-[#111827] hover:!bg-gray-700 py-3 font-semibold rounded-lg shadow-md transition-all duration-200">
        </button>
      </form>

      <div class="mt-6 text-center">
        <a routerLink="/login" class="text-blue-600 hover:text-blue-700 text-sm font-medium">Volver a iniciar sesión</a>
      </div>
    </div>
  </div>
</div>
