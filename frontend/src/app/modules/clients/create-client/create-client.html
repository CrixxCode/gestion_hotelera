<div class="create-overlay" (click)="closeDrawer()">
  <article class="create-drawer" (click)="$event.stopPropagation()">
    <header class="drawer-head">
      <div>
        <h1>Nuevo cliente</h1>
        <p>Registra la informacion principal del cliente y su perfil de hospedaje</p>
      </div>
      <button type="button" class="drawer-close" (click)="closeDrawer()" title="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </header>

    <form [formGroup]="clientForm" (ngSubmit)="submit()" class="drawer-body">
      <section>
        <h2>Datos personales</h2>
        <div class="grid two">
          <label>
            <span>Nombres *</span>
            <input type="text" formControlName="first_name" placeholder="Ej: Sofia" />
            <small *ngIf="first_name?.touched && first_name?.invalid">El nombre es obligatorio.</small>
          </label>

          <label>
            <span>Apellidos *</span>
            <input type="text" formControlName="last_name" placeholder="Ej: Ramirez" />
            <small *ngIf="last_name?.touched && last_name?.invalid">El apellido es obligatorio.</small>
          </label>

          <label>
            <span>Correo *</span>
            <input type="email" formControlName="email" placeholder="cliente@correo.com" />
            <small *ngIf="email?.touched && email?.invalid">Ingresa un correo valido.</small>
          </label>

          <label>
            <span>Telefono</span>
            <input type="text" formControlName="phone" placeholder="+57 300 123 4567" />
          </label>

          <label class="full">
            <span>Pais</span>
            <input type="text" formControlName="country" placeholder="Colombia" />
          </label>
        </div>
      </section>

      <section>
        <h2>Documento</h2>
        <div class="grid two">
          <label>
            <span>Tipo de documento *</span>
            <select formControlName="document_type">
              <option value="CC">CC</option>
              <option value="CE">CE</option>
              <option value="DNI">DNI</option>
              <option value="PASAPORTE">Pasaporte</option>
            </select>
          </label>

          <label>
            <span>Numero de documento *</span>
            <input type="text" formControlName="document_number" placeholder="123456789" />
            <small *ngIf="document_number?.touched && document_number?.invalid">Este campo es obligatorio.</small>
          </label>
        </div>
      </section>

      <p class="feedback error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <footer class="drawer-footer">
        <button type="button" class="btn btn-light" (click)="closeDrawer()" [disabled]="saving">Cancelar</button>
        <button type="submit" class="btn btn-dark" [disabled]="saving">
          {{ saving ? 'Guardando...' : 'Guardar cliente' }}
        </button>
      </footer>
    </form>
  </article>
</div>
