@if (user) {
  <div class="flex flex-col items-center">
    <!-- Avatar -->
    <div class="flex flex-col items-center mb-5">
      @if (resolveAvatar(user.avatar); as avatarUrl) {
        <img
          [src]="avatarUrl"
          alt="Avatar de {{ user.first_name }}"
          class="w-28 h-28 rounded-full border-2 border-gray-300 shadow-md object-cover"
        />
      } @else {
        <div
          class="w-28 h-28 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 text-4xl"
        >
          <i class="pi pi-user"></i>
        </div>
      }

      <h3 class="mt-3 text-lg font-semibold text-gray-800">
        {{ user.first_name }} {{ user.last_name }}
      </h3>
      <p class="text-sm text-gray-500">@{{ user.username }}</p>
    </div>

    <!-- Información -->
    <div class="w-full space-y-2 text-sm text-gray-700 px-2">
      <p><strong>Correo:</strong> {{ user.email }}</p>

      <p>
        <strong>Rol:</strong>
        {{ user.roles?.[0]?.name || user.role?.name || 'Sin rol' }}
      </p>

      <p>
        <strong>Estado:</strong>
        <span
          [ngClass]="{
            'text-green-600 font-semibold': user.status === 'ACTIVE',
            'text-red-600 font-semibold': user.status === 'INACTIVE'
          }"
        >
          {{ user.status === 'ACTIVE' ? 'Activo' : 'Inactivo' }}
        </span>
      </p>
    </div>

    <div class="mt-5 flex justify-end w-full">
      <button
        pButton
        type="button"
        label="Cerrar"
        icon="pi pi-times"
        class="p-button-danger text-white bg-rose-600 hover:bg-rose-700 border-none"
        (click)="closeDialog()"
      ></button>
    </div>
  </div>
}
