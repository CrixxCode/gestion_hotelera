<form [formGroup]="form" (ngSubmit)="onSubmit()" class="drawer-form" enctype="multipart/form-data">
  <header class="drawer-head">
    <div>
      <h2>Nuevo usuario</h2>
      <p>Completa la informacion base para registrar una nueva cuenta</p>
    </div>

    <button type="button" class="head-close" (click)="onCancel()" title="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  </header>

  <div class="drawer-body">
    <section>
      <h3>Perfil</h3>
      <div class="avatar-block">
        <div class="avatar-preview" *ngIf="avatarPreview; else noAvatar">
          <img [src]="avatarPreview" alt="Vista previa del avatar" />
        </div>

        <ng-template #noAvatar>
          <div class="avatar-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
        </ng-template>

        <label class="file-field">
          <span>Avatar</span>
          <input #fileInput type="file" (change)="onFileChange($event)" accept="image/*" />
        </label>
      </div>
    </section>

    <section>
      <h3>Datos personales</h3>
      <div class="grid two">
        <label>
          <span>Nombre *</span>
          <input formControlName="first_name" type="text" />
        </label>

        <label>
          <span>Apellidos *</span>
          <input formControlName="last_name" type="text" />
        </label>
      </div>
    </section>

    <section>
      <h3>Cuenta</h3>
      <div class="grid one">
        <label>
          <span>Nombre de usuario *</span>
          <input formControlName="username" type="text" />
        </label>

        <label>
          <span>Correo electronico *</span>
          <input formControlName="email" type="email" />
        </label>

        <label>
          <span>Contrasena *</span>
          <input formControlName="password" type="password" />
        </label>

        <label class="switch">
          <span>Usuario activo</span>
          <input formControlName="is_active" type="checkbox" />
        </label>
      </div>
    </section>
  </div>

  <footer class="drawer-foot">
    <button type="button" class="btn btn-light" (click)="onCancel()">Cancelar</button>
    <button type="submit" [disabled]="loading" class="btn btn-dark">
      {{ loading ? 'Registrando...' : 'Registrar' }}
    </button>
  </footer>
</form>
