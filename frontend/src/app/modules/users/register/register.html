<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4" enctype="multipart/form-data">
  <!-- Avatar -->
  <div class="flex flex-col items-center">
    <label class="block text-sm font-medium text-gray-700 mb-1">Avatar</label>
    <input
      #fileInput
      type="file"
      (change)="onFileChange($event)"
      accept="image/*"
      class="text-sm text-gray-600 border border-gray-300 rounded-lg cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

    <div *ngIf="avatarPreview" class="mt-3">
      <img
        [src]="avatarPreview"
        alt="Vista previa del avatar"
        class="w-24 h-24 rounded-full object-cover border-2 border-gray-300 shadow-md transition-transform duration-200 hover:scale-105"
      />
    </div>
  </div>

  <!-- Campos de texto -->
  <div>
    <label class="block text-sm font-medium text-gray-700">Nombre</label>
    <input formControlName="first_name" type="text" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700">Apellidos</label>
    <input formControlName="last_name" type="text" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700">Nombre de usuario</label>
    <input formControlName="username" type="text" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700">Correo electrónico</label>
    <input formControlName="email" type="email" class="w-full border rounded px-3 py-2" />
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700">Contraseña</label>
    <input formControlName="password" type="password" class="w-full border rounded px-3 py-2" />
  </div>

  <!-- Botones -->
  <div class="flex justify-end gap-3 pt-3">
    <button
      type="button"
      class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition cursor-pointer"
      (click)="onCancel()"
    >
      <i class="pi pi-times mr-1"></i> Cancelar
    </button>

    <button
      type="submit"
      [disabled]="loading"
      class="bg-[#111827] hover:bg-[#1F2937] text-white px-4 py-2 rounded-lg transition cursor-pointer"
    >
      <i class="pi pi-user-plus mr-1"></i>
      {{ loading ? 'Registrando...' : 'Registrar' }}
    </button>
  </div>
</form>
