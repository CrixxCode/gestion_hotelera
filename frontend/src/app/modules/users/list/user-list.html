<div class="w-full min-h-screen bg-gray-100 px-6 py-6 overflow-y-auto">
  <div class="max-w-[1600px] mx-auto space-y-6">
    <!-- ===== ENCABEZADO ===== -->
    <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
      <h2 class="text-3xl font-semibold text-[#111827] flex items-center gap-2">
        Usuarios
      </h2>

      <div class="flex gap-2 items-center">
        <span class="p-input-icon-left">
          <i class="pi pi-search px-2"></i>
          <input
            pInputText
            type="text"
            placeholder="Buscar usuario..."
            [(ngModel)]="globalFilter"
            class="w-64 md:w-80"
          />
        </span>

        <button
          pButton
          label="Nuevo Usuario"
          icon="pi pi-plus"
          class="p-button-primary font-medium"
          routerLink="/users/create"
        ></button>
      </div>
    </div>

    <!-- ===== TABLA ===== -->
    <div class="!bg-white rounded-xl shadow-md border border-gray-200">
      <p-table
        [value]="users"
        [paginator]="true"
        [rows]="6"
        [loading]="loading"
        [globalFilterFields]="[
          'username',
          'email',
          'first_name',
          'last_name'
        ]"
        [filters]="{
          global: { value: globalFilter, matchMode: 'contains' }
        }"
        class="text-sm"
      >
        <ng-template pTemplate="header">
          <tr class="text-gray-700">
            <th>ID</th>
            <th>Usuario</th>
            <th>Nombre completo</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th class="text-center">Acciones</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-user>
          <tr class="hover:bg-gray-50 transition-colors">
            <td>#{{ user.id }}</td>
            <td class="font-medium text-gray-800">{{ user.username }}</td>
            <td>{{ user.first_name }} {{ user.last_name }}</td>
            <td>{{ user.email }}</td>

            <!-- Rol -->
            <td>
              <p-tag
                [value]="user.role?.name || 'Sin rol'"
              ></p-tag>
            </td>

            <!-- Estado -->
            <td>
              <span
                class="px-2 py-1 rounded-full text-xs font-semibold"
                [ngClass]="{
                  'bg-green-100 text-green-700': user.status === 'ACTIVE',
                  'bg-red-100 text-red-700': user.status === 'INACTIVE'
                }"
              >
                {{ user.status === 'ACTIVE' ? 'Activo' : 'Inactivo' }}
              </span>
            </td>

            <!-- Acciones -->
            <td class="text-center flex justify-center gap-2">
              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-rounded p-button-text text-blue-600 hover:text-blue-800"
                pTooltip="Editar usuario"
              ></button>

              <button
                pButton
                icon="pi pi-trash"
                class="p-button-rounded p-button-text text-red-500 hover:text-red-700"
                (click)="confirmDelete(user)"
                pTooltip="Eliminar usuario"
              ></button>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="8" class="text-center py-4 text-gray-500">
              <i class="pi pi-info-circle mr-2"></i> No se encontraron usuarios.
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <!-- Toast y Confirm -->
  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>
</div>
