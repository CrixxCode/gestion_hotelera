<div class="room-inventory-overlay" (click)="closeDrawer()">
  <article class="room-inventory-drawer" (click)="$event.stopPropagation()">
    <header class="drawer-head">
      <div>
        <h1>Nuevo inventario</h1>
        <p>Asigna items a una habitacion con cantidad base y umbral minimo.</p>
      </div>
      <button type="button" class="drawer-close" (click)="closeDrawer()" title="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </header>

    <form [formGroup]="roomInventoryForm" (ngSubmit)="submit()" class="drawer-body">
      <section>
        <h2>Datos de asignacion</h2>
        <div class="grid two">
          <label class="full">
            <span>Habitacion *</span>
            <select formControlName="room" [class.input-error]="room?.touched && room?.invalid">
              <option [ngValue]="null">Selecciona habitacion</option>
              <option *ngFor="let roomOption of availableRooms; trackBy: trackById" [ngValue]="roomOption.id">
                {{ getRoomLabel(roomOption) }}
              </option>
            </select>
            <small class="field-error" *ngIf="room?.touched && room?.invalid">Selecciona una habitacion.</small>
          </label>

          <label class="full">
            <span>Item *</span>
            <select formControlName="item" [class.input-error]="item?.touched && item?.invalid">
              <option [ngValue]="null">Selecciona item</option>
              <option *ngFor="let itemOption of availableItems; trackBy: trackById" [ngValue]="itemOption.id">
                {{ getItemLabel(itemOption) }}
              </option>
            </select>
            <small class="field-error" *ngIf="item?.touched && item?.invalid">Selecciona un item.</small>
          </label>

          <label>
            <span>Cantidad en habitacion *</span>
            <input
              type="number"
              min="0"
              step="1"
              formControlName="quantity"
              placeholder="Ej: 4"
              [class.input-error]="quantity?.touched && quantity?.invalid" />
            <small class="field-error" *ngIf="quantity?.touched && quantity?.hasError('required')">La cantidad es obligatoria.</small>
            <small class="field-error" *ngIf="quantity?.touched && quantity?.hasError('min')">La cantidad debe ser mayor o igual a 0.</small>
          </label>

          <label>
            <span>Cantidad minima *</span>
            <input
              type="number"
              min="0"
              step="1"
              formControlName="minimum_quantity"
              placeholder="Ej: 2"
              [class.input-error]="minimum_quantity?.touched && minimum_quantity?.invalid" />
            <small class="field-error" *ngIf="minimum_quantity?.touched && minimum_quantity?.hasError('required')">
              La cantidad minima es obligatoria.
            </small>
            <small class="field-error" *ngIf="minimum_quantity?.touched && minimum_quantity?.hasError('min')">
              La cantidad minima debe ser mayor o igual a 0.
            </small>
            <small class="field-hint">{{ selectedItemLabel }}</small>
          </label>

          <label class="full">
            <span>Notas</span>
            <textarea
              rows="4"
              formControlName="notes"
              placeholder="Observaciones de reposicion o uso..."
              [class.input-error]="roomInventoryForm.get('notes')?.touched && roomInventoryForm.get('notes')?.invalid"></textarea>
            <small class="field-error" *ngIf="roomInventoryForm.get('notes')?.touched && roomInventoryForm.get('notes')?.hasError('maxlength')">
              Las notas no pueden superar 2000 caracteres.
            </small>
          </label>

          <label class="full switch-row">
            <input type="checkbox" formControlName="is_active" />
            <span>Asignacion activa en operacion diaria</span>
          </label>
        </div>
      </section>

      <p class="feedback warning" *ngIf="!availableRooms.length">
        No hay habitaciones disponibles para este registro.
      </p>
      <p class="feedback warning" *ngIf="availableRooms.length && !availableItems.length">
        No hay items activos para asociar al inventario de habitaciones.
      </p>
      <p class="feedback error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <footer class="drawer-footer">
        <button type="button" class="btn btn-light" (click)="closeDrawer()" [disabled]="saving">Cancelar</button>
        <button type="submit" class="btn btn-dark" [disabled]="saving || !availableRooms.length || !availableItems.length">
          {{ saving ? 'Guardando...' : 'Guardar asignacion' }}
        </button>
      </footer>
    </form>
  </article>
</div>
